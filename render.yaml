services:
  # -------------------------------------------------------------
  # 1. FastAPI Python Backend Service
  # -------------------------------------------------------------
  - type: web
    name: face-ratio-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13

  # -------------------------------------------------------------
  # 2. Next.js Frontend Web Service
  # -------------------------------------------------------------
  - type: web
    name: face-ratio-frontend
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.12.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: face-ratio-backend
          property: host
